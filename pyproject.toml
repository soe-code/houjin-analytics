[project]
name = "houjin-analytics"
version = "0.1.0"
description = "法人番号データに売上などの財務値を付けた分析用データを作る"
authors = [
    { name = "soe-code", email = "soefm@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
